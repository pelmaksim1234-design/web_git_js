name: Deploy lab5 to GitHub Pages

on:
  push:
    branches:
      - feature/routing
    paths:
      - Typescript/lab5/**
      - .github/workflows/lab5-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-lab5
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Typescript/lab5/package-lock.json
      - run: npm ci
        working-directory: Typescript/lab5
      - run: npm run build
        working-directory: Typescript/lab5
        env:
          VITE_API_URL: https://dummyjson.com
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Typescript/lab5/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
